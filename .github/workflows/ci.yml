name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install lightweight test dependencies
        run: python -m pip install mido fastapi uvicorn

      - name: Verify code compiles
        run: python -m compileall code

      - name: Verify aggregation CLIs
        run: |
          python code/run_call100_objective_search.py --help
          python code/run_call100_ablation_latency.py --help
          python code/build_harmonized_call100_evaluation.py --help
          python code/run_endpoint_benchmark.py --help

      - name: Run regression tests
        run: python -m unittest discover -s code -p 'test_*.py'
